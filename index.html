<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon e ícone de app servidos direto de `public/logo_new.jpeg`, o arquivo corrente da
      marca — o mesmo que a interface usa. É um arquivo só para tudo, de propósito: não existe
      versão derivada da marca neste repositório para sair do lugar quando a arte mudar.

      Sendo JPEG, ele traz um fundo #F7F7F7 opaco em vez de transparência. Na aba do navegador
      isso não atrapalha, e no iOS é até o que se quer: o sistema pinta preto atrás de PNG
      transparente na tela de início, e aqui não há o que pintar. Dentro da interface, quem
      resolve o fundo é o `mix-blend-multiply` do <LogoMark>.
    -->
    <link rel="icon" type="image/jpeg" href="/logo_new.jpeg" />
    <link rel="apple-touch-icon" href="/logo_new.jpeg" />
    <meta name="theme-color" content="#175260" />
    <!--
      viewport-fit=cover é o que faz env(safe-area-inset-*) valer alguma coisa no iOS. Sem ele o
      inset vale zero e a barra de abas fica por baixo do indicador de início do iPhone, mesmo
      com o padding declarado (DESIGN_SYSTEM.md, seção 11).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      A DM Sans é servida do próprio projeto (`public/fonts/`), não do Google. O
      PRODUCT.md diz que a demonstração roda "sem rede": com a fonte vindo de CDN, uma reunião
      com wi-fi ruim perdia a tipografia inteira e caía no fallback do sistema — justamente no
      momento em que o produto precisa parecer acabado.

      Só os dois pesos que aparecem na primeira tela são pré-carregados. O 500 desce junto com o
      CSS, sem concorrer com o que pinta primeiro.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-600-latin.woff2"
      crossorigin
    />
    <title>Acalento Gestão</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
