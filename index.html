<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicons servidos direto de `public/logo-mark.png`, o arquivo oficial da marca: PNG com
      transparência real, que segura tanto na aba clara quanto na escura porque cada forma da
      arte já traz o próprio contorno.

      O apple-touch-icon é o único com fundo (branco) e por isso é um arquivo à parte, gerado a
      partir do mesmo símbolo: o iOS pinta preto atrás de PNG transparente na tela de início.
    -->
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#025658" />
    <!--
      viewport-fit=cover é o que faz env(safe-area-inset-*) valer alguma coisa no iOS. Sem ele o
      inset vale zero e a barra de abas fica por baixo do indicador de início do iPhone, mesmo
      com o padding declarado (DESIGN_SYSTEM.md, seção 11).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      A DM Sans é servida do próprio projeto (`public/fonts/`), não do Google. O
      PRODUCT.md diz que a demonstração roda "sem rede": com a fonte vindo de CDN, uma reunião
      com wi-fi ruim perdia a tipografia inteira e caía no fallback do sistema — justamente no
      momento em que o produto precisa parecer acabado.

      Só os dois pesos que aparecem na primeira tela são pré-carregados. O 500 desce junto com o
      CSS, sem concorrer com o que pinta primeiro.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-600-latin.woff2"
      crossorigin
    />
    <title>Acalento Gestão</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
